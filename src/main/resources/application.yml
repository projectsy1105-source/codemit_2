server:
  port: 8080
spring:
  application:
    name: back
  # 확장자가 없는 .env를 properties 형식으로 읽는다. 파일이 없으면 환경 변수 JWT_SECRET만 사용한다.
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  output:
    ansi:
      enabled: always
  jackson:
    serialization:
      fail-on-empty-beans: false
  jpa:
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        default_batch_fetch_size: 100

jwt:
  # .env 또는 운영 환경의 JWT_SECRET에서 Base64 인코딩한 32바이트 이상 키를 읽는다.
  secret: ${JWT_SECRET:}
  access-token-expiration-minutes: 30
  refresh-token-expiration-days: 14

logging:
  level:
    com.back: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE
